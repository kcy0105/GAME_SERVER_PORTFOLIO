syntax = "proto3";
package Protocol;

import "Enum.proto";

message ObjectInfo
{
	uint64 object_id = 1;
	ObjectType object_type = 2;
	PosInfo pos_info = 3;
}

message PosInfo
{
	uint64 object_id = 1;
	float pos_x = 2;
	float pos_y = 3;
	bool looking_right = 4;
	float velocity_x = 5;
	float velocity_y = 6;
	MoveState state = 7;
}